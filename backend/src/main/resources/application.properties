# =====================================================================
# Smart Expense Tracker - backend configuration
# Every key below is explained with a comment (student-friendly).
# No real secrets here: everything sensitive comes from env variables.
# =====================================================================

# --- Server ------------------------------------------------------------
# Backend listens on 8080. Frontend (Vite) runs on 5173 and calls this.
server.port=8080

# --- Database ----------------------------------------------------------
# PostgreSQL database named "expensetracker".
# Host/port/name/user/password can be overridden with environment variables,
# with local-dev defaults so `mvn spring-boot:run` works out of the box.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expensetracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate: create tables automatically in dev.
# Use "validate" or "none" in production and manage schema with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# NOTE (MySQL compatibility): to run against MySQL instead of PostgreSQL,
#   1. swap the driver in pom.xml: mysql:mysql-connector-j,
#   2. set spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expensetracker}
#      and spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver.
# No code changes are needed - JPA/Hibernate abstracts the SQL dialect.

# --- JWT ---------------------------------------------------------------
# HS256 signing secret. MUST come from the JWT_SECRET env var in production.
# The value below is a DEV-ONLY placeholder - change it in production!
jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-please-use-32-chars-min}
# Token lifetime: 24 hours (in milliseconds).
jwt.expiration-ms=86400000

# --- ML service --------------------------------------------------------
# The Python ML microservice (categorization). Backend calls it when a new
# expense has no category. The frontend never calls ML directly.
ml.service.url=http://localhost:8000

# --- Bank sync ---------------------------------------------------------
# Automatic background bank sync (every 6h). OFF by default so student demos
# don't hit the (mock) bank provider unexpectedly. Enable with
# bank.sync.enabled=true. Manual sync via POST /api/bank/sync always works.
bank.sync.enabled=false

# --- File upload limits (statement import, QR scan) --------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging -----------------------------------------------------------
logging.level.com.expensetracker=INFO
